name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Liquid Glass IPA
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project LiquidGlass.xcodeproj \
            -scheme LiquidGlass \
            -destination 'generic/platform=iOS' \
            -archivePath build/LiquidGlass.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/LiquidGlass.xcarchive/Products/Applications/LiquidGlass.app build/Payload/
          cd build
          zip -r LiquidGlass.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-IPA
          path: build/LiquidGlass.ipa
          retention-days: 7
